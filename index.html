<script>
/* ================= КОНФИГ SUPABASE ================= */
const SUPABASE_URL = 'https://oduwgsoooeealscwuazl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kdXdnc29vb2VlYWxzY3d1YXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTI3OTUsImV4cCI6MjEwMzc2ODc5NX0.VgI5pDn-tRK3vEna3h7OXYUEKzRoPe8m1Ch7PMEAjKA';

/* ================= ПЛАТЁЖНЫЙ ШЛЮЗ (заглушка до подключения ЮKassa) =================
   Когда получишь API-ключи ЮKassa — здесь появится реальный редирект
   на страницу оплаты вместо кнопки "симулировать оплату". */
const PAYMENTS_LIVE = false;

const H = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };
const api = (path) => `${SUPABASE_URL}/rest/v1/${path}`;

async function sbSelect(table, query = '') {
  const res = await fetch(api(`${table}?${query}`), { headers: H });
  if (!res.ok) throw new Error(`Supabase select ${table}: ${res.status}`);
  return res.json();
}
async function sbInsert(table, row) {
  const res = await fetch(api(table), { method: 'POST', headers: { ...H, Prefer: 'return=representation' }, body: JSON.stringify(row) });
  if (!res.ok) throw new Error(`Supabase insert ${table}: ${res.status}`);
  return res.json();
}
async function sbUpdate(table, query, patch) {
  const res = await fetch(api(`${table}?${query}`), { method: 'PATCH', headers: { ...H, Prefer: 'return=representation' }, body: JSON.stringify(patch) });
  if (!res.ok) throw new Error(`Supabase update ${table}: ${res.status}`);
  return res.json();
}

/* ================= СОСТОЯНИЕ ================= */
let subscriber = null;      // { id, phone, name }
let partners = [];
let plans = [];
let currentFilter = 'all';
let currentVenue = null;
let activeSubscription = null;

function saveLocalSubscriber(s) { localStorage.setItem('vk_subscriber', JSON.stringify(s)); }
function loadLocalSubscriber() { try { return JSON.parse(localStorage.getItem('vk_subscriber')); } catch (e) { return null; } }

/* ================= ВЕРИФИКАЦИЯ QR (для персонала партнёра) =================
   Если ссылка открыта как index.html?verify=ТОКЕН — показываем экран проверки
   вместо обычного приложения. Так партнёр может отсканировать QR любым
   сканером и сразу увидеть, действительна ли привилегия. */
async function checkVerifyMode() {
  const params = new URLSearchParams(location.search);
  const token = params.get('verify');
  if (!token) return false;

  const root = document.getElementById('app-root');
  root.innerHTML = '<div class="loading">Проверка…</div>';
  try {
    const rows = await sbSelect('vk_redemptions', `token=eq.${encodeURIComponent(token)}&select=redeemed_at,vk_partners(name,perk),vk_subscribers(phone,name)`);
    if (!rows.length) {
      root.innerHTML = `<div class="verify-wrap"><div class="verify-fail"><h2>Не найдено</h2><p>Такой код не зарегистрирован в системе.</p></div></div>`;
      return true;
    }
    const r = rows[0];
    const when = new Date(r.redeemed_at).toLocaleString('ru-RU');
    root.innerHTML = `
      <div class="verify-wrap">
        <div class="verify-ok">
          <h2>✓ Действительно</h2>
          <p style="margin-top:10px; font-weight:800;">${r.vk_partners.name}</p>
          <p>${r.vk_partners.perk}</p>
          <p style="margin-top:10px; font-size:12px; opacity:0.8;">Выдано: ${when}</p>
        </div>
      </div>`;
  } catch (e) {
    root.innerHTML = `<div class="verify-wrap"><div class="verify-fail"><h2>Ошибка проверки</h2><p>${e.message}</p></div></div>`;
  }
  return true;
}

/* ================= ЗАГРУЗКА ДАННЫХ ================= */
async function loadCatalog() {
  [partners, plans] = await Promise.all([
    sbSelect('vk_partners', 'active=eq.true&order=id.asc'),
    sbSelect('vk_plans', 'active=eq.true&order=duration_months.asc'),
  ]);
}

async function loadActiveSubscription() {
  if (!subscriber) return;
  const rows = await sbSelect('vk_subscriptions',
    `subscriber_id=eq.${subscriber.id}&status=eq.active&order=expires_at.desc&limit=1&select=*,vk_plans(name)`);
  activeSubscription = rows[0] || null;
}

/* ================= ВХОД ПО ТЕЛЕФОНУ (упрощённый, без SMS — см. schema.sql) ================= */
function renderLogin() {
  const root = document.getElementById('app-root');
  root.innerHTML = `
    <div class="view active">
      <div class="login-wrap">
        <img src="assets/logo-dark.png" alt="Вместе, Краснодар" style="height:110px; display:block; margin:0 auto 18px auto;">
        <div class="sub">Введите номер телефона, чтобы войти или зарегистрироваться</div>
        <input type="tel" id="phone-input" placeholder="+7 900 000-00-00">
        <button class="cta-btn" id="login-btn" onclick="doLogin()">Продолжить</button>
        <div class="hint">Пилотная версия: вход только по номеру, без SMS-кода.</div>
      </div>
    </div>`;
}


function normalizePhone(raw) {
  let digits = raw.replace(/\D/g, '');
  if (digits.length === 11 && digits[0] === '8') digits = '7' + digits.slice(1);
  if (digits.length === 10) digits = '7' + digits;
  return digits;
}

async function doLogin() {
  const input = document.getElementById('phone-input');
  const btn = document.getElementById('login-btn');
  const phone = normalizePhone(input.value.trim());
  if (!phone || phone.length < 11) { alert('Введите корректный номер телефона'); return; }

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Подождите…';
  btn.style.opacity = '0.6';
  try {
    let existing = await sbSelect('vk_subscribers', `phone=eq.${encodeURIComponent(phone)}`);
    let s;
    if (existing.length) {
      s = existing[0];
    } else {
      const created = await sbInsert('vk_subscribers', { phone });
      s = created[0];
    }
    subscriber = s;
    saveLocalSubscriber(s);
    await bootApp();
  } catch (e) {
    alert('Не удалось войти: ' + e.message);
    btn.disabled = false;
    btn.textContent = originalText;
    btn.style.opacity = '1';
  }
}

          <div class="info-row"><span>Часы действия</span><span id="detail-hours">-</span></div>
        </div>
        <button class="cta-btn" id="detail-redeem-btn" onclick="showRedeem()">Показать привилегию</button>
      </div>
    </div>

    <div class="view" id="view-redeem">
      <div class="redeem-wrap">
        <div class="back-btn" style="position:static; display:inline-flex; margin-bottom:16px; background:#EFE8F5; color:#6B5A4C;" onclick="showView('detail')">←</div>
        <div class="redeem-card">
          <div class="redeem-status">✓ Подписка активна</div>
          <h3 id="redeem-name">Заведение</h3>
          <div class="sub">Покажите экран администратору</div>
          <div id="qr-canvas"></div>
          <div class="redeem-perk" id="redeem-perk">-</div>
          <div class="redeem-note">Уникальный код, действителен для одного применения</div>
        </div>
      </div>
    </div>

    <div class="view" id="view-mycard">
      <div class="mycard-header"><h1>Моя карта</h1></div>
      <div id="mycard-status-wrap"></div>
      <div class="section-title">Тарифы</div>
      <div class="plan-list" id="plan-list"></div>
    </div>

    <div class="view" id="view-pay">
      <div class="pay-stub">
        <div class="back-btn" style="position:static; display:inline-flex; margin-bottom:16px; background:#EFE8F5; color:#6B5A4C;" onclick="showView('mycard')">←</div>
        <div class="box">
          <div class="dev-badge">ТЕСТОВЫЙ РЕЖИМ</div>
          <div style="font-size:13px; color:#6B5A4C;">Тариф</div>
          <div style="font-size:18px; font-weight:800;" id="pay-plan-name">-</div>
          <div class="amount" id="pay-amount">0 ₽</div>
          <div class="note">Ключи ЮKassa ещё не подключены. Сейчас можно только проверить весь путь целиком — реальное списание не происходит.</div>
          <button class="cta-btn" onclick="simulatePayment()">Симулировать успешную оплату</button>
        </div>
      </div>
    </div>

    <div class="view" id="view-profile">
      <div class="profile-header">
        <div class="avatar" id="avatar-letter">?</div>
        <div class="profile-header-info">
          <div class="name-row" id="name-row"></div>
          <div class="role-label" id="profile-phone-sub">-</div>
        </div>
      </div>

      <div class="contribution-card" id="contribution-card">
        <div class="label">ВАШ ВКЛАД В ГОРОД</div>
        <div class="amount">…</div>
      </div>

      <div class="stats-row" id="stats-row"></div>

      <div id="favorite-venue"></div>

      <div class="section-title-profile">История посещений</div>
      <div id="visit-list"><div class="empty-state">Загрузка…</div></div>

      <div class="menu-list">
        <div class="menu-item" onclick="logout()"><span class="t" style="color:#D2456B;">Выйти</span></div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab active" data-tab="catalog" onclick="switchTab('catalog')"><span class="ic">🏠</span>Каталог</div>
      <div class="tab" data-tab="mycard" onclick="switchTab('mycard')"><span class="ic">🎫</span>Моя карта</div>
      <div class="tab" data-tab="profile" onclick="switchTab('profile')"><span class="ic">👤</span>Профиль</div>
    </div>
  `;

  document.getElementById('chips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
    chip.classList.add('active');
    renderVenues(chip.dataset.cat);
  });

  renderVenues('all');
  renderMyCard();
  renderPlans();
  document.getElementById('profile-phone-sub').textContent = subscriber.phone;
  renderNameDisplay();
}

function renderNameDisplay() {
  const nameRow = document.getElementById('name-row');
  const avatarEl = document.getElementById('avatar-letter');
  if (!nameRow) return;
  const hasName = subscriber.name && subscriber.name.trim();
  nameRow.innerHTML = hasName
    ? `<span class="name">${subscriber.name}</span><span class="edit-pencil">✏️</span>`
    : `<span class="name placeholder">Добавить имя</span><span class="edit-pencil">✏️</span>`;
  nameRow.onclick = startEditName;
  if (avatarEl) {
    avatarEl.textContent = hasName ? subscriber.name.trim()[0].toUpperCase() : subscriber.phone.replace(/\D/g, '').slice(-2);
  }
}

function startEditName() {
  const nameRow = document.getElementById('name-row');
  if (!nameRow) return;
  const currentName = subscriber.name || '';
  nameRow.innerHTML = `<input type="text" id="name-edit-input" placeholder="Ваше имя" maxlength="40">`;
  const input = document.getElementById('name-edit-input');
  input.value = currentName;
  input.focus();
  input.select();
  input.onblur = saveNameEdit;
  input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
}

async function saveNameEdit() {
  const input = document.getElementById('name-edit-input');
  if (!input) return;
  const newName = input.value.trim();
  try {
    await sbUpdate('vk_subscribers', `id=eq.${subscriber.id}`, { name: newName || null });
    subscriber.name = newName || null;
    saveLocalSubscriber(subscriber);
  } catch (e) {
    console.error('Не удалось сохранить имя:', e);
  }
  renderNameDisplay();
}

let currentSearchText = '';

function renderVenues(filter) {
  currentFilter = filter;
  applyVenueFilters();
}

function onSearchInput(text) {
  currentSearchText = text.trim().toLowerCase();
  applyVenueFilters();
}

function applyVenueFilters() {
  const list = document.getElementById('venue-list');
  list.innerHTML = '';
  const filtered = partners.filter((p) => {
    const matchesCat = currentFilter === 'all' || String(p.category || '').trim().toLowerCase() === currentFilter;
    const hay = (p.name + ' ' + (p.perk || '')).toLowerCase();
    const matchesSearch = !currentSearchText || hay.includes(currentSearchText);
    return matchesCat && matchesSearch;
  });
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">Ничего не найдено — попробуйте другой запрос или категорию</div>';
    return;
  }
  filtered.forEach((p) => {
    const el = document.createElement('div');
    el.className = 'venue-card';
    el.onclick = () => openDetail(p.id);
    el.innerHTML = `
      <div class="venue-thumb" style="background:${p.color || '#eee'}">${p.icon || '⭐'}</div>
      <div class="venue-info">
        <div class="venue-name">${p.name}</div>
        <div class="venue-cat">${catLabel(p.category)}</div>
        <div class="venue-perk">${p.perk}</div>
      </div>
      <div class="chev">›</div>`;
    list.appendChild(el);
  });
}
function catLabel(c) { return { food: 'Общепит', beauty: 'Красота', fit: 'Фитнес', wear: 'Одежда' }[c] || c; }

function openDetail(id) {
  currentVenue = partners.find((p) => p.id === id);
  document.getElementById('detail-name').textContent = currentVenue.name;
  document.getElementById('detail-perk').textContent = currentVenue.perk;
  document.getElementById('detail-cat').textContent = catLabel(currentVenue.category);
  document.getElementById('detail-addr').textContent = currentVenue.address || '-';
  document.getElementById('detail-hours').textContent = currentVenue.hours || '-';
  const btn = document.getElementById('detail-redeem-btn');
  if (!activeSubscription) {
    btn.textContent = 'Нужна активная подписка';
    btn.onclick = () => showView('mycard');
  } else {
    btn.textContent = 'Показать привилегию';
    btn.onclick = showRedeem;
  }
  showView('detail');
}

async function showRedeem() {
  if (!activeSubscription) { showView('mycard'); return; }
  document.getElementById('redeem-name').textContent = currentVenue.name;
  document.getElementById('redeem-perk').textContent = currentVenue.perk;
  showView('redeem');

  // Уникальный токен на каждое предъявление + запись в базу
  const token = 'r_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  try {
    await sbInsert('vk_redemptions', { subscriber_id: subscriber.id, partner_id: currentVenue.id, token });
  } catch (e) {
    console.error('Не удалось записать погашение:', e);
  }
  const qrEl = document.getElementById('qr-canvas');
  qrEl.innerHTML = '';
  const verifyUrl = `${location.origin}${location.pathname}?verify=${token}`;
  new QRCode(qrEl, { text: verifyUrl, width: 180, height: 180, colorDark: '#0B2E2C', colorLight: '#ffffff' });
}

function renderMyCard() {
  const wrap = document.getElementById('mycard-status-wrap');
  if (activeSubscription) {
    const until = new Date(activeSubscription.expires_at).toLocaleDateString('ru-RU');
    wrap.innerHTML = `
      <div class="sub-card">
        <div class="tier">ТАРИФ · ${activeSubscription.vk_plans.name.toUpperCase()}</div>
        <div class="status">Подписка активна</div>
        <div class="valid">Действует до ${until}</div>
      </div>`;
  } else {
    wrap.innerHTML = `
      <div class="sub-card" style="background:linear-gradient(135deg,#9C8CA6,#6B5A4C);">
        <div class="tier">СТАТУС</div>
        <div class="status">Подписки пока нет</div>
        <div class="valid">Выберите тариф ниже</div>
      </div>`;
  }
}

function renderPlans() {
  const list = document.getElementById('plan-list');
  list.innerHTML = '';
  plans.forEach((p) => {
    const el = document.createElement('div');
    el.className = 'plan-item';
    el.onclick = () => startCheckout(p);
    el.innerHTML = `<span class="name">${p.name}</span><span class="price">${p.price_rub} ₽</span>`;
    list.appendChild(el);
  });
}

let checkoutPlan = null;
let checkoutSubscriptionId = null;
let checkoutPaymentId = null;

async function startCheckout(plan) {
  checkoutPlan = plan;
  document.getElementById('pay-plan-name').textContent = plan.name;
  document.getElementById('pay-amount').textContent = plan.price_rub + ' ₽';
  showView('pay');
  try {
    const [sub] = await sbInsert('vk_subscriptions', { subscriber_id: subscriber.id, plan_id: plan.id, status: 'pending' });
    const [pay] = await sbInsert('vk_payments', { subscriber_id: subscriber.id, plan_id: plan.id, amount_rub: plan.price_rub, status: 'pending' });
    checkoutSubscriptionId = sub.id;
    checkoutPaymentId = pay.id;
  } catch (e) {
    alert('Не удалось начать оформление: ' + e.message);
  }
}

async function simulatePayment() {
  if (!checkoutSubscriptionId) return;
  const now = new Date();
  const expires = new Date(now);
  expires.setMonth(expires.getMonth() + checkoutPlan.duration_months);
  try {
    await sbUpdate('vk_payments', `id=eq.${checkoutPaymentId}`, { status: 'succeeded', paid_at: now.toISOString() });
    await sbUpdate('vk_subscriptions', `id=eq.${checkoutSubscriptionId}`, {
      status: 'active', starts_at: now.toISOString(), expires_at: expires.toISOString(),
    });
    await loadActiveSubscription();
    renderMyCard();
    switchTab('mycard');
    alert('Подписка активирована (тестовый режим)');
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

function showView(name) {
  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
}
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  showView(name);
  if (name === 'profile') renderProfileExtras();
}

async function renderProfileExtras() {
  try {
    const [redemptions, payments] = await Promise.all([
      sbSelect('vk_redemptions', `subscriber_id=eq.${subscriber.id}&select=redeemed_at,partner_id,vk_partners(name,icon,color)&order=redeemed_at.desc&limit=15`),
      sbSelect('vk_payments', `subscriber_id=eq.${subscriber.id}&status=eq.succeeded&select=amount_rub`),
    ]);

    const totalPaid = payments.reduce((sum, p) => sum + p.amount_rub, 0);
    const charityContribution = Math.round(totalPaid * 0.20);
    const card = document.getElementById('contribution-card');
    if (card) {
      card.innerHTML = `
        <div class="label">ВАШ ВКЛАД В ГОРОД</div>
        <div class="amount">${charityContribution.toLocaleString('ru-RU')} ₽</div>
        <div class="note">Пятая часть каждой вашей оплаты идёт в благотворительный фонд города — просто за то, что вы с нами.</div>
      `;
    }

    const memberSince = subscriber.created_at
      ? new Date(subscriber.created_at).toLocaleDateString('ru-RU', { month: 'short', year: 'numeric' })
      : '—';
    const statsRow = document.getElementById('stats-row');
    if (statsRow) {
      statsRow.innerHTML = `
        <div class="stat-box"><span class="num">${redemptions.length}</span><span class="lbl">посещений</span></div>
        <div class="stat-box"><span class="num">${memberSince}</span><span class="lbl">с нами с</span></div>
      `;
    }

    // Любимое заведение — то, куда чаще всего заходили за привилегией
    const favBox = document.getElementById('favorite-venue');
    if (favBox) {
      if (redemptions.length < 2) {
        favBox.innerHTML = '';
      } else {
        const counts = {};
        redemptions.forEach((r) => {
          if (!r.partner_id) return;
          counts[r.partner_id] = (counts[r.partner_id] || 0) + 1;
        });
        const topId = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
        const topRedemption = redemptions.find((r) => String(r.partner_id) === String(topId));
        if (topRedemption && topRedemption.vk_partners) {
          favBox.innerHTML = `
            <div class="fav-venue-card" onclick="jumpToVenue(${topId})">
              <div class="venue-thumb" style="background:${topRedemption.vk_partners.color || '#eee'}">${topRedemption.vk_partners.icon || '⭐'}</div>
              <div class="venue-info">
                <div class="fav-label">ЛЮБИМОЕ МЕСТО</div>
                <div class="venue-name">${topRedemption.vk_partners.name}</div>
              </div>
              <div class="chev">›</div>
            </div>`;
        }
      }
    }

    const visitList = document.getElementById('visit-list');
    if (visitList) {
      if (!redemptions.length) {
        visitList.innerHTML = '<div class="empty-state">Пока нет посещений — самое время попробовать первую привилегию в каталоге!</div>';
      } else {
        visitList.innerHTML = redemptions.map((r) => `
          <div class="visit-item" ${r.partner_id ? `onclick="jumpToVenue(${r.partner_id})"` : ''}>
            <span class="vi-name">${r.vk_partners ? r.vk_partners.name : 'Заведение'}</span>
            <span class="vi-date">${new Date(r.redeemed_at).toLocaleDateString('ru-RU')}</span>
          </div>
        `).join('');
      }
    }
  } catch (e) {
    const visitList = document.getElementById('visit-list');
    if (visitList) visitList.innerHTML = '<div class="empty-state">Не удалось загрузить историю</div>';
    console.error('Ошибка загрузки профиля:', e);
  }
}

function jumpToVenue(partnerId) {
  const p = partners.find((x) => x.id === partnerId);
  if (!p) return;
  switchTab('catalog');
  openDetail(partnerId);
}

function logout() {
  localStorage.removeItem('vk_subscriber');
  location.reload();
}

/* ================= СТАРТ ================= */
async function bootApp() {
  const root = document.getElementById('app-root');
  root.innerHTML = '<div class="loading">Загрузка…</div>';
  try {
    await loadCatalog();
    await loadActiveSubscription();
    renderApp();
  } catch (e) {
    root.innerHTML = `<div class="loading">Ошибка загрузки: ${e.message}<br><br>Проверьте, что таблицы созданы в Supabase (schema.sql) и ключи верны.</div>`;
  }
}

(async function init() {
  if (await checkVerifyMode()) return;

  subscriber = loadLocalSubscriber();
  if (subscriber) {
    await bootApp();
  } else {
    renderLogin();
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
})();
</script>
